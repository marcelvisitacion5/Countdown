<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:transparent;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    display:flex;
    gap:18px;
}

.box{
    background:#ffffff;
    border-radius:15px;
    padding:18px 20px;
    min-width:95px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.number{
    font-size:46px;
    font-weight:bold;
    color:#ff6d12;
}

.label{
    margin-top:6px;
    font-size:14px;
    color:#666;
    text-transform:uppercase;
    letter-spacing:1px;
}

.finished{
    font-size:32px;
    font-weight:bold;
    color:#ff6d12;
}
</style>
</head>

<body>

<div id="countdown" class="container">

<div class="box">
<div id="days" class="number">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div id="hours" class="number">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div id="minutes" class="number">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div id="seconds" class="number">00</div>
<div class="label">Seconds</div>
</div>

</div>

<script>

//===============================
// SET YOUR TARGET DATE HERE
//===============================

const targetDate = new Date("August 31, 2026 23:00:00").getTime();

//===============================

const days=document.getElementById("days");
const hours=document.getElementById("hours");
const minutes=document.getElementById("minutes");
const seconds=document.getElementById("seconds");
const countdown=document.getElementById("countdown");

function updateCountdown(){

const now=new Date().getTime();

const distance=targetDate-now;

if(distance<0){
countdown.innerHTML='<div class="finished">🎉 Event Started!</div>';
return;
}

const d=Math.floor(distance/(1000*60*60*24));
const h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const m=Math.floor((distance%(1000*60*60))/(1000*60));
const s=Math.floor((distance%(1000*60))/1000);

days.innerHTML=String(d).padStart(2,'0');
hours.innerHTML=String(h).padStart(2,'0');
minutes.innerHTML=String(m).padStart(2,'0');
seconds.innerHTML=String(s).padStart(2,'0');

}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
