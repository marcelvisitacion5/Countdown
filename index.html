<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flip Countdown</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wrapper">

    <h1 id="title"></h1>

    <div id="countdown">

        <div class="unit">
            <div class="flip" id="days">00</div>
            <span>DAYS</span>
        </div>

        <div class="unit">
            <div class="flip" id="hours">00</div>
            <span>HOURS</span>
        </div>

        <div class="unit">
            <div class="flip" id="minutes">00</div>
            <span>MINUTES</span>
        </div>

        <div class="unit">
            <div class="flip" id="seconds">00</div>
            <span>SECONDS</span>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
